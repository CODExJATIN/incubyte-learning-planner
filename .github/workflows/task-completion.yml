name: Email on Task Completion

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  send-email:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:

      - name: Resolve PR data
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR=$(curl -s \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pulls?state=closed&base=main&per_page=1")

            echo "PR_TITLE=$(echo "$PR" | jq -r '.[0].title')" >> $GITHUB_ENV
            echo "PR_BODY<<EOF" >> $GITHUB_ENV
            echo "$(echo "$PR" | jq -r '.[0].body')" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            echo "PR_URL=$(echo "$PR" | jq -r '.[0].html_url')" >> $GITHUB_ENV
            echo "PR_NUMBER=$(echo "$PR" | jq -r '.[0].number')" >> $GITHUB_ENV

          else
            echo "PR_TITLE=${{ github.event.pull_request.title }}" >> $GITHUB_ENV

            echo "PR_BODY<<EOF" >> $GITHUB_ENV
            echo "${{ github.event.pull_request.body }}" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV

            echo "PR_URL=${{ github.event.pull_request.html_url }}" >> $GITHUB_ENV
            echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          fi


      - name: Convert Markdown to HTML
        run: |
          HTML=$(printf "%s" "${{ env.PR_BODY }}" | npx marked)

          echo "PR_BODY_HTML<<EOF" >> $GITHUB_ENV
          echo "$HTML" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV


      - name: Send Email via Brevo API
        run: |
          HTML_CONTENT=$(cat <<EOF
          <div style="margin: 20px auto; max-width: 600px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; border: 1px solid #d0d7de; border-radius: 8px; background-color: #ffffff; overflow: hidden; box-shadow: 0 1px 3px rgba(31,35,40,0.12);">
            
            <div style="background-color: #dafbe1; padding: 12px 16px; border-bottom: 1px solid #d0d7de; display: flex; align-items: center;">
              <span style="background-color: #1a7f37; color: #ffffff; border-radius: 20px; padding: 2px 10px; font-size: 12px; font-weight: 600; margin-right: 12px; display: inline-block; line-height: 18px;">
                Completed
              </span>
              <span style="color: #1a7f37; font-size: 14px; font-weight: 500;">
                Task successfully merged into <strong>main</strong>
              </span>
            </div>

            <div style="padding: 24px;">
              
              <div style="margin-bottom: 24px;">
                <div style="font-size: 11px; color: #57606a; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;">
                  Task Title
                </div>
                <h2 style="margin: 0; font-size: 20px; font-weight: 600; color: #1f2328; line-height: 1.4;">
                  ${{ env.PR_TITLE }}
                </h2>
              </div>

              <div style="margin-bottom: 24px;">
                <div style="font-size: 11px; color: #57606a; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;">
                  Description / Notes
                </div>
                <div style="background-color: #f6f8fa; border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; font-size: 14px; color: #24292f; line-height: 1.6; min-height: 40px;">
                  ${{ env.PR_BODY_HTML }}
                </div>
              </div>

              <div style="border-top: 1px solid #d0d7de; padding-top: 20px;">
                <div style="display: flex; justify-content: space-between; font-size: 13px; color: #57606a; margin-bottom: 16px;">
                  <div>
                    <strong style="color: #1f2328;">Repository:</strong> ${{ github.repository }}
                  </div>
                  <div>
                    <strong style="color: #1f2328;">ID:</strong> <span style="color: #8250df; font-weight: 600;">#${{ env.PR_NUMBER }}</span>
                  </div>
                </div>

                <div style="padding:10px 12px;background:#f6f8fa;border:1px solid #d0d7de;border-radius:6px;font-size:12px;color:#57606a;">
                  <span style="font-weight:600;color:#24292f;">Pull Request</span><br>
                  <span style="font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;color:#0969da;">
                    🔗 github.com/CODExJATIN/incubyte-learning-planner/pull/${{ env.PR_NUMBER }}
                  </span>
                </div>
              </div>

            </div>
          </div>
          EOF
          )

          JSON_HTML=$(jq -Rs . <<< "$HTML_CONTENT")

          curl --request POST \
            --url https://api.brevo.com/v3/smtp/email \
            --header "accept: application/json" \
            --header "api-key:${{ secrets.BREVO_API_KEY }}" \
            --header "content-type: application/json" \
            --data "{
              \"sender\": {\"name\": \"CODExGIT\", \"email\": \"${{ secrets.FROM_EMAIL }}\"},
              \"to\": [
                {\"email\": \"${{ secrets.TO_EMAIL }}\", \"name\": \"Jatin\"},
                {\"email\": \"${{ secrets.TO_EMAIL1 }}\", \"name\": \"${{ secrets.TO_NAME1 }}\"},
                {\"email\": \"${{ secrets.TO_EMAIL2 }}\", \"name\": \"${{ secrets.TO_NAME2 }}\"}
              ],
              \"subject\": \"Task Completed: ${{ env.PR_TITLE }}\",
              \"htmlContent\": $JSON_HTML
            }"